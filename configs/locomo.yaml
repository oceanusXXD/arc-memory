run_id: locomo_arc
seed: 7

paths:
  raw_data: data/LoCoMo/data/locomo10.json
  split_manifest: data/splits/locomo_group_split.json
  processed_dir: data/processed
  cache_dir: data/cache
  models_dir: models
  runs_dir: runs

api:
  protocol: claude_code
  timeout_seconds: 900

models:
  agent: ${ARC_AGENT_MODEL_ID:Qwen/Qwen3.5-4B}
  builder: ${ARC_BUILDER_MODEL_ID:Qwen/Qwen3.5-4B}
  compiler: ${ARC_COMPILER_MODEL_ID:Qwen/Qwen3.5-4B}
  auditor: ${ARC_AUDITOR_MODEL_ID:Qwen/Qwen3.5-4B}
  teacher: ${ARC_TEACHER_MODEL_ID:grok-4.6}

claude_code:
  command: ${CLAUDE_CODE_COMMAND:claude}
  model: ${CLAUDE_CODE_MODEL:Qwen/Qwen3.5-4B}
  timeout_seconds: 900
  require_credentials: true
  base_url: ${ANTHROPIC_BASE_URL:https://api.siliconflow.cn}
  api_key_env: ${ARC_API_KEY_ENV:SILICONFLOW_API_KEY}
  thinking: true
  thinking_budget_tokens: 1024
  extra_args: []

agent:
  provider: claude_code
  model: ${ARC_AGENT_MODEL_ID:Qwen/Qwen3.5-4B}
  max_tokens: 2048
  temperature: 0.7
  timeout_seconds: 900
  extra_args: []

compiler:
  provider: claude_code
  evaluate_queries: true
  tau_query: 0.5
  tau_utility: 0.5
  tau_coverage: 0.5

decoder:
  temperature: 0.7
  constructor_max_tokens: 2048
  relation_render_tokens: 512

tokenizer:
  enabled: true
  model: ${ARC_BUILDER_MODEL_ID:Qwen/Qwen3.5-4B}
  trust_remote_code: true
  chat_template_kwargs:
    enable_thinking: true

retrieval:
  embedding_model: Qwen/Qwen3-Embedding-4B
  embedding_device: cuda
  query_prompt_name: query
  cache_vectors: true
  backend: hybrid
  top_k: 128
  rrf_k: 60
  source_cap_tokens: 8192
  max_blocks: 64

budgets:
  agent_context_tokens: 16384
  builder_input_limit: 15872
  builder_input_tokens: 4096
  deployment: [1024, 2048, 4096]

splits:
  train: [conv-26, conv-30, conv-41, conv-42, conv-43, conv-44]
  dev: [conv-47, conv-48]
  final: [conv-49, conv-50]

experiment_groups:
  D_seed: [conv-26, conv-30]
  D_value: [conv-41, conv-42]
  D_dev: [conv-43, conv-44]
  D_cal: [conv-47, conv-48]
  D_eval: [conv-49, conv-50]

selector:
  checkpoint: ""
  architectures: [Flat, Chain, Tree, Graph, Cluster]
  beam_width: 4
  width: 128
  layers: 2
  heads: 4
  ff: 512
  dropout: 0.0

baselines:
  fixed_top_k: 4
